
<form id="contact-form">
  <input type="text" name="name" placeholder="الاسم الكامل" required>
  <input type="tel" name="phone" placeholder="رقم الجوال" required>
  <textarea name="message" placeholder="اكتب رسالتك أو استفسارك"></textarea>
  <button type="submit" class="btn btn-primary">إرسال الطلب عبر واتساب</button>
</form>
<a href="https://wa.me/966544447611"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="تواصل معنا عبر واتساب"
   title="تواصل معنا عبر واتساب"
   style="position:fixed;left:20px;bottom:20px;z-index:9999;
          width:56px;height:56px;border-radius:50%;
          background:#25D366;color:white;
          display:flex;align-items:center;justify-content:center;
          box-shadow:0 6px 18px rgba(0,0,0,.22);">

  <svg xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 32 32"
       width="31"
       height="31"
       fill="currentColor"
       aria-hidden="true">
    <path d="M16 .9A15 15 0 0 0 3.1 23.5L1 31l7.7-2A15.1 15.1 0 1 0 16 .9Zm0 27.4c-2.3 0-4.6-.6-6.5-1.8l-.5-.3-4.6 1.2 1.2-4.4-.3-.5A12.3 12.3 0 1 1 16 28.3Zm6.7-9.2c-.4-.2-2.2-1.1-2.6-1.2-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7.4-.6c.1-.2 0-.5 0-.7l-1.2-2.9c-.3-.8-.7-.7-1-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 3 4.6 7.2 6.4 1 .4 1.8.6 2.4.8 1 .3 1.9.2 2.6.2.8-.1 2.2-.9 2.5-1.8.3-.9.3-1.7.2-1.8-.1-.2-.4-.3-.8-.5Z"/>
  </svg>
</a>
<script>
  document.getElementById('contact-form').addEventListener('submit', function (event) {
    event.preventDefault();

    const name = this.elements.name.value.trim();
    const phone = this.elements.phone.value.trim();
    const message = this.elements.message.value.trim();

    const text =
      'مرحبًا، لدي طلب عبر موقع سهم المرافق:\n\n' +
      'الاسم: ' + name + '\n' +
      'رقم الجوال: ' + phone + '\n' +
      'الطلب: ' + (message || 'لم تُذكر تفاصيل');

    window.location.href =
      'https://wa.me/966544447611?text=' + encodeURIComponent(text);
  });
</script>
